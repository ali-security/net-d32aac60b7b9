name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated test names to run instead of the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODULE_PATH: golang.org/x/net
      MODULE_VERSION: v0.45.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod declares `go 1.24.0`, but the http2 suite (transport_test.go,
          # server_test.go, ...) is gated on `go1.25 || goexperiment.synctest`,
          # so Go 1.25 (current at the v0.45.0 release) is needed to run it.
          go-version: "1.25"
          cache: false

      - name: Produce module zip
        run: |
          set -euo pipefail
          # Zip a copy of the module tree without this workflow, which is
          # build scaffolding and not part of the published module.
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/zipper" build_output
          rsync -a --exclude=.git --exclude=build_output ./ "$RUNNER_TEMP/modsrc/"
          # upstream ships no .github directory, so drop it whole.
          rm -rf "$RUNNER_TEMP/modsrc/.github"
          cat > "$RUNNER_TEMP/zipper/main.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/zipper"
          go mod init example.com/zipper
          go get golang.org/x/mod@v0.24.0
          go run . "$MODULE_PATH" "$MODULE_VERSION" "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/build_output/$MODULE_VERSION.zip"
          unzip -l "$GITHUB_WORKSPACE/build_output/$MODULE_VERSION.zip" | tail -1

      - name: Build
        run: |
          go version
          go build ./...

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -eo pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $TEST_FILTER; do grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test $t did not run"; exit 1; }; done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
            awk '/--- PASS/{p++} /--- FAIL/{f++} /--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$RUNNER_TEMP/full.log"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: go-module-zip
          path: build_output/*.zip
          if-no-files-found: error
